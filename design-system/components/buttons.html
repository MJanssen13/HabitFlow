<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&display=swap" rel="stylesheet" />
<style>
  :root{--surface:#fff;--content:#0f172a;--muted:#64748b;--faint:#94a3b8;--base:#f8fafc;--line:#e2e8f0;--brand:#4f46e5;--brand-soft:#e0e7ff;}
  .dark{--surface:#0f172a;--content:#f1f5f9;--muted:#94a3b8;--faint:#64748b;--base:#020617;--line:#1e293b;--brand:#818cf8;--brand-soft:#312e81;}
  *{box-sizing:border-box;font-family:'Inter',system-ui,sans-serif;}
  body{margin:0;}
  .stage{display:grid;grid-template-columns:1fr 1fr;}
  .panel{padding:32px;background:var(--base);color:var(--content);}
  h2.title{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--faint);margin:0 0 18px;font-weight:700;}
  .row{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:16px;}
  button{font-family:inherit;font-weight:600;font-size:14px;border-radius:12px;padding:10px 18px;border:1px solid transparent;cursor:pointer;}
  .primary{background:var(--brand);color:#fff;box-shadow:0 10px 30px -12px rgba(79,70,229,.6);}
  .soft{background:var(--brand-soft);color:var(--brand);}
  .ghost{background:transparent;color:var(--muted);border-color:var(--line);}
  .quick{background:rgba(59,130,246,.12);color:#3b82f6;border-color:rgba(59,130,246,.25);border-radius:12px;font-weight:700;}
  .danger{background:transparent;color:var(--faint);padding:10px;border-radius:10px;}
</style>
</head>
<body>
<div class="stage">
  <div class="panel">
    <h2 class="title">Botões</h2>
    <div class="row"><button class="primary">Exportar</button><button class="soft">Ativar lembretes</button><button class="ghost">Análises</button></div>
    <div class="row"><button class="quick">+ 250</button><button class="quick">+ 500</button><button class="quick">+ 750</button></div>
  </div>
  <div class="panel dark">
    <h2 class="title">Botões</h2>
    <div class="row"><button class="primary">Exportar</button><button class="soft">Ativar lembretes</button><button class="ghost">Análises</button></div>
    <div class="row"><button class="quick">+ 250</button><button class="quick">+ 500</button><button class="quick">+ 750</button></div>
  </div>
</div>
</body>
</html>
