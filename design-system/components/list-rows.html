<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&display=swap" rel="stylesheet" />
<style>
  :root{--surface:#fff;--content:#0f172a;--muted:#64748b;--faint:#94a3b8;--base:#f8fafc;--line:#e2e8f0;--elevated:#f1f5f9;}
  .dark{--surface:#0f172a;--content:#f1f5f9;--muted:#94a3b8;--faint:#64748b;--base:#020617;--line:#1e293b;--elevated:#1e293b;}
  *{box-sizing:border-box;font-family:'Inter',system-ui,sans-serif;}
  body{margin:0;}
  .stage{display:grid;grid-template-columns:1fr 1fr;}
  .panel{padding:28px;background:var(--base);color:var(--content);}
  h2.title{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--faint);margin:0 0 16px;font-weight:700;}
  .lbl{font-size:12px;color:var(--muted);margin:16px 0 8px;font-weight:600;}
  .meal{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border:1px solid var(--line);background:var(--elevated);border-radius:12px;}
  .meal .name{font-size:14px;font-weight:500;}
  .btns{display:flex;gap:6px;}
  .pill{font-size:12px;font-weight:700;padding:6px 12px;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--faint);}
  .pill.bad{background:rgba(244,63,94,.15);color:#f43f5e;border-color:rgba(244,63,94,.3);}
  .pill.good{background:rgba(16,185,129,.15);color:#10b981;border-color:rgba(16,185,129,.3);}
  .med{display:flex;align-items:center;justify-content:space-between;padding:12px;border:1px solid var(--line);border-radius:14px;background:var(--elevated);margin-top:8px;}
  .med.taken{background:rgba(244,63,94,.1);border-color:rgba(244,63,94,.25);}
  .med .left{display:flex;align-items:center;gap:12px;}
  .cbox{width:24px;height:24px;border-radius:7px;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;}
  .cbox.on{background:#f43f5e;border-color:#f43f5e;color:#fff;}
  .time{font-size:12px;color:var(--muted);font-weight:600;}
</style>
</head>
<body>
<div class="stage">
  <div class="panel">
    <h2 class="title">Linhas de lista</h2>
    <div class="lbl">Refeição</div>
    <div class="meal"><span class="name">Almoço</span><div class="btns"><span class="pill bad">Inadequada</span><span class="pill">Adequada</span></div></div>
    <div class="meal" style="margin-top:8px"><span class="name">Jantar</span><div class="btns"><span class="pill">Inadequada</span><span class="pill good">Adequada</span></div></div>
    <div class="lbl">Medicamento</div>
    <div class="med taken"><div class="left"><span class="cbox on"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></span><span class="name">Losartana 50mg</span></div><span class="time">08:00</span></div>
    <div class="med"><div class="left"><span class="cbox"></span><span class="name">Vitamina D</span></div><span class="time">12:00</span></div>
  </div>
  <div class="panel dark">
    <h2 class="title">Linhas de lista</h2>
    <div class="lbl">Refeição</div>
    <div class="meal"><span class="name">Almoço</span><div class="btns"><span class="pill bad">Inadequada</span><span class="pill">Adequada</span></div></div>
    <div class="meal" style="margin-top:8px"><span class="name">Jantar</span><div class="btns"><span class="pill">Inadequada</span><span class="pill good">Adequada</span></div></div>
    <div class="lbl">Medicamento</div>
    <div class="med taken"><div class="left"><span class="cbox on"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></span><span class="name">Losartana 50mg</span></div><span class="time">08:00</span></div>
    <div class="med"><div class="left"><span class="cbox"></span><span class="name">Vitamina D</span></div><span class="time">12:00</span></div>
  </div>
</div>
</body>
</html>
