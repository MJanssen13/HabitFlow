<!-- @dsCard group="Fundações" -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
<style>
  :root{--surface:#fff;--content:#0f172a;--muted:#64748b;--faint:#94a3b8;--base:#f8fafc;--line:#e2e8f0;}
  .dark{--surface:#0f172a;--content:#f1f5f9;--muted:#94a3b8;--faint:#64748b;--base:#020617;--line:#1e293b;}
  *{box-sizing:border-box;font-family:'Inter',system-ui,sans-serif;}
  body{margin:0;}
  .stage{display:grid;grid-template-columns:1fr 1fr;}
  .panel{padding:32px;background:var(--base);color:var(--content);}
  h2.title{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--faint);margin:0 0 18px;font-weight:700;}
  .row{display:flex;gap:18px;flex-wrap:wrap;}
  .box{background:var(--surface);border:1px solid var(--line);width:130px;height:90px;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--muted);}
  .r-lg{border-radius:16px;}.r-xl{border-radius:24px;}.r-full{border-radius:9999px;width:90px;}
  .sh-card{box-shadow:0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04);}
  .sh-lift{box-shadow:0 10px 30px -12px rgba(0,0,0,.35);}
</style>
</head>
<body>
<div class="stage">
  <div class="panel">
    <h2 class="title">Raio & Elevação</h2>
    <div class="row">
      <div class="box r-lg">radius 16</div>
      <div class="box r-xl">radius 24</div>
      <div class="box r-full">full</div>
    </div>
    <div class="row" style="margin-top:26px">
      <div class="box r-xl sh-card">shadow-card</div>
      <div class="box r-xl sh-lift">shadow-lift</div>
    </div>
  </div>
  <div class="panel dark">
    <h2 class="title">Raio & Elevação</h2>
    <div class="row">
      <div class="box r-lg">radius 16</div>
      <div class="box r-xl">radius 24</div>
      <div class="box r-full">full</div>
    </div>
    <div class="row" style="margin-top:26px">
      <div class="box r-xl sh-card">shadow-card</div>
      <div class="box r-xl sh-lift">shadow-lift</div>
    </div>
  </div>
</div>
</body>
</html>
